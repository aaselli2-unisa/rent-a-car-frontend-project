server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # SPA fallback: ogni route sconosciuta → index.html (React Router gestisce il resto)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy verso il backend Spring Boot (rete interna Docker)
    # Il browser non tocca mai :8080 direttamente
    location /api/ {
        proxy_pass         http://rentacar-app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache aggressiva per asset statici (hash nel nome file garantisce busting)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}